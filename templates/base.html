<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { color: #2c3e50; }
        nav a { margin-right: 15px; text-decoration: none; color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #2c3e50; color: white; }
        form input, form textarea { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
        button { background: #2980b9; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
        .actions a { margin-right: 8px; }
        .status-pendiente { color: #e67e22; font-weight: bold; }
        .status-completada { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📋 Task Manager</h1>
    <nav>
        <a href="/">Inicio</a>
        <a href="/create">Nueva tarea</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
