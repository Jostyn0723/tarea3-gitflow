<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f0f2f5;
            color: #333;
        }
        header.app-header { text-align: center; margin-bottom: 30px; }
        h1 { color: #1a2b4c; font-size: 28px; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 14px; }
        nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        nav a {
            text-decoration: none; color: #fff; background: #2980b9;
            padding: 8px 18px; border-radius: 20px; font-size: 14px;
            transition: background 0.2s;
        }
        nav a:hover { background: #1f6391; }
        .card {
            background: #fff; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 20px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        form label { display: block; font-weight: 600; margin-top: 14px; margin-bottom: 4px; font-size: 14px; color: #444; }
        form input, form textarea, form select {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
        }
        button {
            margin-top: 20px; background: #2980b9; color: white; border: none;
            padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px;
        }
        button:hover { background: #1f6391; }
        .actions a { margin-right: 12px; font-size: 13px; text-decoration: none; color: #2980b9; }
        .actions a:last-child { color: #c0392b; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-pendiente { background: #fdecd2; color: #e67e22; }
        .status-completada { background: #dff6e5; color: #27ae60; }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>📋 Task Manager</h1>
        <p class="subtitle">Organiza tus tareas de forma simple</p>
    </header>
    <nav>
        <a href="/">Inicio</a>
        <a href="/create">Nueva tarea</a>
    </nav>
    <div class="card">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
