{% extends "base.html" %}
{% block content %}
<h2>Editar tarea</h2>
<form method="POST">
    <label>Título</label>
    <input type="text" name="title" value="{{ task['title'] }}" required>

    <label>Descripción</label>
    <textarea name="description" rows="3">{{ task['description'] }}</textarea>

    <label>Fecha límite</label>
    <input type="date" name="due_date" value="{{ task['due_date'] }}">

    <label>Estado</label>
    <select name="status">
        <option value="pendiente" {% if task['status'] == 'pendiente' %}selected{% endif %}>Pendiente</option>
        <option value="completada" {% if task['status'] == 'completada' %}selected{% endif %}>Completada</option>
    </select>

    <button type="submit">Actualizar tarea</button>
</form>
{% endblock %}
